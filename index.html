<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ArchiPlan</title>
<meta name="theme-color" content="#0b0b0c">
<style>
:root{--bg:#0b0b0c;--ui:#151618;--line:#2a2c30;--ink:#f2f2f2;--mut:#9aa0a6;--acc:#e0a526}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--ui);border-bottom:1px solid var(--line)}
header img{width:36px;height:36px;border-radius:9px}
.t{flex:1;min-width:0}.t b{display:block;font-size:15px}
.t span{display:block;font-size:12px;color:var(--acc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
select,button,input{font:inherit;color:var(--ink)}
select,.bt{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px}
select{max-width:128px}
#wrap{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#pp{background:var(--ui);border-top:1px solid var(--line);padding:6px 8px;display:flex;flex-direction:column;gap:6px;max-height:34%;overflow:auto}
.row{display:flex;gap:5px;overflow-x:auto;align-items:center}
.row .bt{flex:none;padding:7px 10px;font-size:12px}
.sw{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);padding:0}
.on{border-color:var(--acc)!important;color:var(--acc)}
#st{padding:6px 12px;font-size:12px;color:var(--mut);background:var(--ui);border-top:1px solid var(--line)}
#tb{display:flex;gap:4px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--ui);overflow-x:auto}
#tb .bt{flex:none;min-width:58px;padding:10px 6px;font-size:12px;text-align:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:8;display:flex;align-items:flex-end;justify-content:center}
.box{background:var(--ui);width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-height:85%;overflow:auto}
.box input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px;width:100%}
.box h4{margin:4px 0 0;font-size:13px;color:var(--mut);font-weight:600}
#splash{position:fixed;inset:0;background:#0b0b0c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:9;transition:opacity .5s}
#splash img{width:140px;height:140px;border-radius:30px}
#splash b{font-size:24px;color:#f2f2f2}#splash span{color:#e0a526;font-size:16px}
</style>
</head>
<body>
<div id="app">
<header><img id="hl" alt=""><div class="t"><b>ArchiPlan</b><span>Arch. Adamu Umar Sarki</span></div><select id="unit" aria-label="Units"></select><button class="bt" id="mn" aria-label="Menu">&#9776;</button></header>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="pp" hidden></div>
<div id="st"></div>
<nav id="tb"></nav>
</div>
<div class="ov" id="menu" hidden><div class="box" id="mb"></div></div>
<div class="ov" id="md" hidden><div class="box"><b id="mt"></b><input id="mi" autocomplete="off"><div class="row"><button class="bt" id="mc">Cancel</button><button class="bt on" id="mk">OK</button></div></div></div>
<div id="splash"><img id="sl" alt=""><b>ArchiPlan</b><span>Arch. Adamu Umar Sarki</span></div>
<script src="logo.js"></script>
<script src="core.js"></script>
<script src="tools.js"></script>
<script src="ui.js"></script>
</body>
</html>
