<style>
:root{--bg:#0b0b0c;--panel:#151618;--line:#2a2c30;--gold:#e0a526;--text:#f2f2f2;--mut:#9aa0a6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header img{width:36px;height:36px;border-radius:9px}
.t{flex:1;min-width:0}
.t b{display:block;font-size:15px}
.t span{display:block;font-size:12px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 6px;font-size:13px;max-width:150px}
#wrap{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#st{padding:7px 12px;font-size:13px;color:var(--mut);background:var(--panel);border-top:1px solid var(--line);min-height:32px}
nav{display:flex;gap:4px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--panel)}
nav button{flex:1;padding:11px 0;font-size:12px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:9px}
nav button.on{border-color:var(--gold);color:var(--gold)}
#splash{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:9;transition:opacity .5s}
#splash img{width:140px;height:140px;border-radius:30px}
#splash b{font-size:24px}
#splash span{color:var(--gold);font-size:16px}
</style>
</head>

<div id="wrap"><canvas id="cv"></canvas></div>
<div id="st"></div>
<nav>
<button data-t="pan">Pan</button><button data-t="wall" class="on">Wall</button><button data-t="erase">Erase</button><button id="undo">Undo</button><button id="ortho" class="on">Ortho</button><button id="snap" class="on">Snap</button><button id="clear">Clear</button>
</nav>
</div>
<div id="splash"><img id="sl" alt=""><b>ArchiPlan</b><span>Arch. Adamu Umar Sarki</span></div>
<script>
const $=s=>document.querySelector(s);
// logo, favicon and install manifest are built from the embedded images
$('#hl').src=I192;$('#sl').src=I192;
{const l=document.createElement('link');l.rel='icon';l.href=I192;document.head.appendChild(l);
 const a=document.createElement('link');a.rel='apple-touch-icon';a.href=I512;document.head.appendChild(a);
 try{const u=location.origin+location.pathname;
  const m={name:'ArchiPlan',short_name:'ArchiPlan',start_url:u,scope:u,display:'standalone',background_color:'#0b0b0c',theme_color:'#0b0b0c',
   icons:[{src:I192,sizes:'192x192',type:'image/webp'},{src:I512,sizes:'512x512',type:'image/webp'}]};
  const k=document.createElement('link');k.rel='manifest';k.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));document.head.appendChild(k);}catch(e){}}
const cv=$('#cv'),ctx=cv.getContext('2d');
// all lengths are stored in millimetres; f = mm per unit, s = snap step in mm
const UNITS={mm:{l:'Millimetres (mm)',f:1,s:100},cm:{l:'Centimetres (cm)',f:10,s:100},m:{l:'Metres (m)',f:1000,s:500},in:{l:'Inches (in)',f:25.4,s:152.4},ft:{l:'Feet (ft)',f:304.8,s:304.8},ftin:{l:'Feet and inches',f:304.8,s:304.8}};
const T=230; // wall thickness, mm
let S={walls:[],unit:'m'},view={x:20,y:40,k:0.05},tool='wall',ortho=true,snap=true,undo=[],dpr=1,drag=null,pinch=null;
const ptrs=new Map();
try{const d=JSON.parse(localStorage.getItem('archiplan'));if(d&&d.walls){S=d;if(!UNITS[S.unit])S.unit='m';}}catch(e){}
const save=()=>{try{localStorage.setItem('archiplan',JSON.stringify(S))}catch(e){}};
const sel=$('#unit');
for(const u in UNITS){const o=document.createElement('option');o.value=u;o.textContent=UNITS[u].l;sel.appendChild(o);}
sel.value=S.unit;
sel.onchange=()=>{S.unit=sel.value;save();draw();};
function fmt(mm){
  if(S.unit==='ftin'){const i=Math.round(mm/25.4);return Math.floor(i/12)+"'-"+(i%12)+'"';}
  const v=mm/UNITS[S.unit].f;return (S.unit==='mm'?Math.round(v):Math.round(v*100)/100)+' '+S.unit;
}
const sx=x=>x*view.k+view.x,sy=y=>y*view.k+view.y;
const toW=(px,py)=>[(px-view.x)/view.k,(py-view.y)/view.k];
function snapPt(x,y,from){
  let bd=16/view.k,b=null;
  for(const w of S.walls)for(const p of [[w.x1,w.y1],[w.x2,w.y2]]){const d=Math.hypot(p[0]-x,p[1]-y);if(d<bd){bd=d;b=p;}}
  if(b)return{x:b[0],y:b[1]};
  if(snap){const g=UNITS[S.unit].s;x=Math.round(x/g)*g;y=Math.round(y/g)*g;}
  if(ortho&&from){if(Math.abs(x-from.x)<Math.abs(y-from.y))x=from.x;else y=from.y;}
  return{x,y};
}
function distSeg(px,py,w){
  const dx=w.x2-w.x1,dy=w.y2-w.y1,l=dx*dx+dy*dy;let t=l?((px-w.x1)*dx+(py-w.y1)*dy)/l:0;
  t=Math.max(0,Math.min(1,t));return Math.hypot(px-(w.x1+t*dx),py-(w.y1+t*dy));
}
function push(){undo.push(JSON.stringify(S.walls));if(undo.length>100)undo.shift();}
function eraseAt(x,y){
  let i=-1,bd=18/view.k;
  S.walls.forEach((w,j)=>{const d=distSeg(x,y,w);if(d<bd){bd=d;i=j;}});
  if(i>=0){push();S.walls.splice(i,1);save();}
}
function label(w,col){
  const a=sx(w.x1),b=sy(w.y1),c=sx(w.x2),d=sy(w.y2),L=Math.hypot(c-a,d-b);
  if(L<45)return;
  const nx=-(d-b)/L,ny=(c-a)/L;let ang=Math.atan2(d-b,c-a);
  if(ang>Math.PI/2||ang<-Math.PI/2)ang+=Math.PI;
  ctx.save();ctx.translate((a+c)/2+nx*16,(b+d)/2+ny*16);ctx.rotate(ang);
  ctx.fillStyle=col;ctx.font='11px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(fmt(Math.hypot(w.x2-w.x1,w.y2-w.y1)),0,0);ctx.restore();
}
function wall(w,col){
  ctx.strokeStyle=col;ctx.lineWidth=Math.max(T*view.k,3);ctx.lineCap='square';
  ctx.beginPath();ctx.moveTo(sx(w.x1),sy(w.y1));ctx.lineTo(sx(w.x2),sy(w.y2));ctx.stroke();
}
function draw(){
  const W=cv.clientWidth,H=cv.clientHeight;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  let step=UNITS[S.unit].s;while(step*view.k<9)step*=2;
  const x0=-view.x/view.k,y0=-view.y/view.k,x1=(W-view.x)/view.k,y1=(H-view.y)/view.k;
  ctx.lineWidth=1;
  for(let x=Math.floor(x0/step)*step;x<=x1;x+=step){ctx.strokeStyle=Math.round(x/step)%5===0?'#33363c':'#1c1e21';ctx.beginPath();ctx.moveTo(sx(x),0);ctx.lineTo(sx(x),H);ctx.stroke();}
  for(let y=Math.floor(y0/step)*step;y<=y1;y+=step){ctx.strokeStyle=Math.round(y/step)%5===0?'#33363c':'#1c1e21';ctx.beginPath();ctx.moveTo(0,sy(y));ctx.lineTo(W,sy(y));ctx.stroke();}
  for(const w of S.walls){wall(w,'#f2f2f2');label(w,'#9aa0a6');}
  let msg={pan:'Drag to move the drawing. Pinch to zoom.',wall:'Drag on the grid to draw a wall.',erase:'Tap a wall to delete it.'}[tool];
  if(drag&&drag.t==='wall'){
    const w={x1:drag.a.x,y1:drag.a.y,x2:drag.b.x,y2:drag.b.y};
    wall(w,'#e0a526');label(w,'#e0a526');msg='Wall length: '+fmt(Math.hypot(w.x2-w.x1,w.y2-w.y1));
  }
  $('#st').textContent=msg+'   |   Walls: '+S.walls.length;
}
function resize(){dpr=window.devicePixelRatio||1;cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr;draw();}
function zoomAt(mx,my,f){
  const k=Math.min(2,Math.max(0.005,view.k*f)),wx=(mx-view.x)/view.k,wy=(my-view.y)/view.k;
  view.k=k;view.x=mx-wx*k;view.y=my-wy*k;draw();
}
function startPinch(){const[p,q]=[...ptrs.values()];pinch={d:Math.hypot(p.x-q.x,p.y-q.y),mx:(p.x+q.x)/2,my:(p.y+q.y)/2,k:view.k,vx:view.x,vy:view.y};}
function doPinch(){
  const[p,q]=[...ptrs.values()],d=Math.hypot(p.x-q.x,p.y-q.y),mx=(p.x+q.x)/2,my=(p.y+q.y)/2;
  const k=Math.min(2,Math.max(0.005,pinch.k*d/pinch.d)),wx=(pinch.mx-pinch.vx)/pinch.k,wy=(pinch.my-pinch.vy)/pinch.k;
  view.k=k;view.x=mx-wx*k;view.y=my-wy*k;draw();
}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(ptrs.size===2){drag=null;startPinch();draw();return;}
  if(ptrs.size>2)return;
  const[wx,wy]=toW(e.offsetX,e.offsetY);
  if(tool==='wall'){const p=snapPt(wx,wy,null);drag={t:'wall',a:p,b:p};}
  else if(tool==='pan')drag={t:'pan',sx:e.offsetX,sy:e.offsetY,vx:view.x,vy:view.y};
  else eraseAt(wx,wy);
  draw();
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(ptrs.size===2&&pinch){doPinch();return;}
  if(!drag)return;
  if(drag.t==='wall'){const[wx,wy]=toW(e.offsetX,e.offsetY);drag.b=snapPt(wx,wy,drag.a);}
  else{view.x=drag.vx+e.offsetX-drag.sx;view.y=drag.vy+e.offsetY-drag.sy;}
  draw();
});
function end(e){
  ptrs.delete(e.pointerId);pinch=null;
  if(drag&&drag.t==='wall'&&Math.hypot(drag.a.x-drag.b.x,drag.a.y-drag.b.y)>50){
    push();S.walls.push({x1:drag.a.x,y1:drag.a.y,x2:drag.b.x,y2:drag.b.y});save();
  }
  drag=null;draw();
}
cv.addEventListener('pointerup',end);
cv.addEventListener('pointercancel',end);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,e.deltaY<0?1.1:0.9);},{passive:false});
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{
  tool=b.dataset.t;document.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));draw();
});
$('#undo').onclick=()=>{if(undo.length){S.walls=JSON.parse(undo.pop());save();draw();}};
$('#ortho').onclick=e=>{ortho=!ortho;e.currentTarget.classList.toggle('on',ortho);};
$('#snap').onclick=e=>{snap=!snap;e.currentTarget.classList.toggle('on',snap);};
$('#clear').onclick=()=>{if(S.walls.length&&confirm('Clear the whole drawing?')){push();S.walls=[];save();draw();}};
window.addEventListener('resize',resize);
resize();
setTimeout(()=>{const s=$('#splash');s.style.opacity=0;setTimeout(()=>s.remove(),500);},1600);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
